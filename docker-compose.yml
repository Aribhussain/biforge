version: '3.8'

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.10
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=INTERNAL://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr=INTERNAL://redpanda:9092,OUTSIDE://localhost:19092
    ports:
      - "9092:9092"
      - "19092:19092"

  mongodb:
    image: mongo:7.0.5
    environment:
      MONGO_INITDB_ROOT_USERNAME: tf_admin
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_pw
    ports:
      - "27017:27017"
    secrets:
      - mongo_pw

  opensearch:
    image: opensearchproject/opensearch:2.11.1
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
    ports:
      - "9200:9200"

  ingestion-api:
    build:
      context: .
      dockerfile: ingestion-api/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - redpanda

  parsing-worker:
    build:
      context: .
      dockerfile: parsing-worker/Dockerfile
    depends_on:
      - redpanda
      - mongodb
      - opensearch
      
  audit-worker:
    build:
      context: .
      dockerfile: audit-worker/Dockerfile
    depends_on:
      - mongodb
      - opensearch

  tiebreaker-worker:
    build:
      context: .
      dockerfile: tiebreaker-worker/Dockerfile
    depends_on:
      - redpanda
      - mongodb
      - opensearch
    extra_hosts:
      - "host.docker.internal:host-gateway"

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.1
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      - opensearch

secrets:
  mongo_pw:
    file: ./secrets/mongo_pw.txt